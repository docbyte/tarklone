[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tarklone"
version = "0.1.0"
description = "Bidirektionaler Ordner-Sync für Tarkle (Windows Tray App)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "docbyte" }]
dependencies = [
    "httpx>=0.28",
    "keyring>=25",
    "pystray>=0.19",
    "pillow>=11",
    "watchdog>=6",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[project.scripts]
tarklone = "tarklone.cli:main"
tarklone-tray = "tarklone.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
